[build]
  # Explicit "." so this always wins over a stale dashboard "Base directory"
  # setting (ex: a leftover from when site/dist was committed and served
  # directly, before it became build output). The build command needs the
  # repo root — package.json, scripts/, spec/ — not the output directory.
  base = "."
  command = "npm run build"
  publish = "site/dist"

# Correct Content-Types for agent/machine-readable artifacts

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/AGENTS.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# The bundled schema lives under /v<version>/…; glob covers every version dir
[[headers]]
  for = "/v*/*.schema.json"
  [headers.values]
    Content-Type = "application/schema+json; charset=utf-8"

# A bare version root (ex: /v0.15.2, no trailing path) has no file of its own —
# send it to the bundled schema for that version. Split schema files under
# /v<version>/… (ex: /v0.15.2/common/criterion.schema.json) are real files on
# disk, so they're served directly and never reach this rule.
[[redirects]]
  from = "/v*"
  to = "/v:splat/dsds.bundled.schema.json"
  status = 301
