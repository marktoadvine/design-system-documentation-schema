id: stability
kind: entry
name: Stability and the road to 1.0
description: What is settled and what is still in flux in the pre-1.0 DSDS schema, and what changes without a spec bump versus what does not.

metadata:
  tags: [meta, stability]

refs:
  - href: conformance.html
    rel: see-also
    role: Conformance levels and the validator's semantic-rule surface

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: Pre-1.0 draft
        body: "DSDS {{VERSION}} is a **pre-1.0 draft**. Some parts of the schema absorb new vocabulary without a spec change. Other parts are closed, load-bearing structural decisions that need a spec change. This page tells those apart."
      - title: How schema changes get made
        body: "Every schema file under `schema/` carries `$comment` fields that explain *why* a shape is the way it is. In several places, they also explain what the shape replaced and why the replacement is better. Reading those comments alongside the schema is the current source of truth for the spec's own change history. There is no separate, versioned changelog yet."

  - kind: definitions
    for: all
    title: Designed to grow without a version bump
    description: A handful of fields are open, pattern-validated strings rather than closed enums, so that new values do not require a schema change.
    items:
      - term: entries/token.tokenType
        definition: "A token's category (`color`, `spacing`, `typography`, ...) is validated by pattern, not an enum. A new token category is just a new string."
      - term: common/ref.rel
        definition: "The relationship a ref expresses (`depends-on`, `same-as`, `implements`, ...) is open. New well-known values get documented in the schema's own `$comment`, not gated behind a release."
      - term: metadata.status's status value
        definition: "`stable`/`experimental`/`deprecated`/... is open too, for the same reason: this spec does not dictate a project's lifecycle vocabulary."
      - term: entry.id and common/id
        definition: A lowercase-dash-dot pattern, not a fixed list of segments - accepts whatever hierarchy your system actually has.
      - term: $extensions
        definition: A namespaced escape hatch for vendor or tool data at the entry or section level. A tool integration never has to wait on a spec release to add a field.
    freeform:
      - title: Building tools against this list
        body: Treat these as safe to build tooling around. Your validator, generator, or docs site must not hardcode the current set of values for any of them.

  - kind: definitions
    for: all
    title: More likely to be load-bearing
    description: A few shapes are closed enums because the number of cases is a structural fact about the spec, not an open vocabulary.
    items:
      - term: entry.kind
        definition: "5 well-known values (`system`, `component`, `token`, `theme`, `entry`), 4 with their own `entries/<kind>.schema.yaml` file, plus a namespaced custom-kind escape hatch (e.g. `acme.icon-library`) for a document that wants its own recognizable name instead of the generic `entry`. Adding a well-known value changes what \"kind of thing\" this spec can describe at all, not just a detail within one - that bar stays high."
      - term: common/requirement-level
        definition: "5 values (`must`, `should`, `should-not`, `must-not`, `may`), matching RFC 2119. This is borrowed vocabulary, not this spec's to extend."
      - term: sections/* (the 4 section kinds)
        definition: "`guidelines`, `definitions`, `steps`, `section`. Any entry kind can use any of them; there is no per-kind gating. `section` is the generic fallback, the same role `entry` plays for entries. `freeform` is not a section kind at all - it's a field every section kind can carry. This is the part of the schema most likely to still change before 1.0."
    freeform:
      - title: Which list to code against
        body: If you build a tool that must survive schema evolution, code defensively against the second list, not the first.

  - kind: steps
    for: all
    ordered: true
    title: Criteria for declaring 1.0
    description: "1.0 is declared when, at minimum:"
    items:
      - title: The section-kind set and entry-kind set stop changing
        description: Across at least one real consolidation pass, with no further merge or split needed.
      - title: A second independent consumer exists
        description: At least one tool that the spec authors do not maintain reads or writes DSDS documents in earnest. This tests the spec's assumptions from outside.
      - title: The validator's semantic-rule surface is stable
        description: "These are the checks that pure JSON Schema cannot express (`tools/validate.js`). The project does not add or rename them release to release."
        refs:
          - href: conformance.html
            rel: see-also
    freeform:
      - title: Until 1.0
        body: Until then, the closed enums above are the most stable part of the schema. Everything else can still change between minor versions, including the exact shape of any one sections/*.schema.yaml file.
