id: grid
kind: component
name: Grid
description: A CSS grid layout primitive with template columns, rows, and auto-flow control.
purpose: Arrange children in a CSS grid layout with configurable columns, rows, and gaps.

metadata:
  status: {status: stable}
  tags: [layout, primitive, grid]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/grid
    rel: external-link
    role: Sanity UI docs — Grid

related:
  - to: flex
    rel: alternative-to
    note: Flex is one-dimensional (row or column). Grid is two-dimensional with explicit column and row tracks.

sourceFiles:
  - platform: react
    file: ./src/primitives/grid/grid.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Grid extends Box with CSS grid layout props. It provides template columns and rows, auto-flow, gap, and per-item column/row placement. All props accept responsive arrays.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: gridTemplateColumns
        definition: "number | number[]. Number of equal-width columns. Accepts a responsive array."
      - term: gridTemplateRows
        definition: "number | number[]. Number of equal-height rows."
      - term: gap
        definition: "number | number[]. Gap between all grid cells on the spacing scale."
      - term: gapX
        definition: "number | number[]. Horizontal (column) gap."
      - term: gapY
        definition: "number | number[]. Vertical (row) gap."
      - term: autoFlow
        definition: "GridAutoFlow | GridAutoFlow[]. CSS grid-auto-flow. Controls how auto-placed items flow."
      - term: autoRows
        definition: "GridAutoRows | GridAutoRows[]. CSS grid-auto-rows. Size of implicitly created rows."
      - term: autoCols
        definition: "GridAutoCols | GridAutoCols[]. CSS grid-auto-columns."
      - term: gridColumn
        definition: "GridItemColumn | GridItemColumn[]. Applied to a grid child: span across columns."
      - term: gridColumnStart
        definition: "GridItemColumnStart | GridItemColumnStart[]. Applied to a grid child: column start line."
      - term: gridColumnEnd
        definition: "GridItemColumnEnd | GridItemColumnEnd[]. Applied to a grid child: column end line."
      - term: gridRow
        definition: "GridItemRow | GridItemRow[]. Applied to a grid child: row span."
