id: spinner
kind: component
name: Spinner
description: An animated loading indicator that communicates an in-progress operation.
purpose: Communicate that an operation is in progress.

metadata:
  status: {status: stable}
  tags: [feedback, loading, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/spinner
    rel: external-link
    role: Sanity UI docs — Spinner

sourceFiles:
  - platform: react
    file: ./src/primitives/spinner/spinner.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Spinner renders a circular animated SVG to indicate that content is loading or an operation is in progress. It supports muted rendering and a size scale. It does not provide its own accessible label — the surrounding context or an aria-label on a wrapper must describe what is loading.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: size
        definition: "number | number[]. Size on the spinner scale."
      - term: muted
        definition: "boolean. Renders in muted foreground color for lower visual prominence."

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Always provide an accessible loading label via aria-label on a wrapper or via a visually-hidden text sibling — Spinner is a purely visual indicator, and without a text alternative, screen reader users receive no loading feedback.
        level: must
        tags: [accessibility]
      - statement: Respect prefers-reduced-motion by wrapping in a conditional check when used outside of Button (which handles this automatically) — animated content can trigger vestibular disorders in users with motion sensitivity.
        level: must
        tags: [accessibility]

  - kind: guidelines
    for: agent
    context: how-to-use
    items:
      - statement: Always provide a text alternative for the loading state accessible to screen readers.
        level: must
