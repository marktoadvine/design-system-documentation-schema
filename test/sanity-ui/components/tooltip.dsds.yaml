id: tooltip
kind: component
name: Tooltip
description: A small floating label that appears on hover or focus to describe an element.
purpose: Show a brief descriptive label near an element on hover or focus.

metadata:
  status: {status: stable}
  tags: [overlay, feedback, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/tooltip
    rel: external-link
    role: Sanity UI docs — Tooltip

related:
  - to: popover
    rel: alternative-to
    note: Popover shows rich interactive content triggered by click. Tooltip shows a brief read-only label on hover/focus.

sourceFiles:
  - platform: react
    file: ./src/primitives/tooltip/tooltip.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Tooltip wraps a trigger element and shows a brief descriptive label on hover or keyboard focus. It positions itself automatically relative to the trigger using floating UI. Use it to label icon-only buttons or supplement visible labels with additional context.

  - kind: definitions
    for: all
    title: Anatomy
    description: Tooltip wraps a trigger child and renders a floating panel when active.
    items:
      - term: Trigger
        definition: The element that triggers the tooltip on hover/focus. Passed as `children`. Required.
      - term: Tooltip Panel
        definition: The floating label panel containing the tooltip content. Required.
      - term: Arrow
        definition: An optional directional arrow pointing from the panel toward the trigger.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: content
        definition: "React.ReactNode. The content to display inside the tooltip panel."
      - term: placement
        definition: "'top' | 'right' | 'bottom' | 'left' | 'top-start' | 'top-end' | 'bottom-start' | 'bottom-end'. Preferred placement of the tooltip panel relative to the trigger."
      - term: fallbackPlacements
        definition: "Placement[]. Fallback placements when the preferred placement is not available."
      - term: portal
        definition: "boolean. Renders the tooltip in a portal (appended to body) to avoid clipping by overflow containers."
      - term: disabled
        definition: "boolean. Disables the tooltip, preventing it from showing."
      - term: animate
        definition: "boolean. Enables entrance/exit animation."
      - term: delay
        definition: "number. Hover delay in milliseconds before the tooltip appears."
      - term: arrow
        definition: "boolean. Show a directional arrow pointing toward the trigger."
      - term: padding
        definition: "number | number[]. Internal padding of the tooltip panel."
      - term: radius
        definition: "number | number[]. Border radius of the tooltip panel."
      - term: scheme
        definition: "'light' | 'dark'. Color scheme of the tooltip panel."

  - kind: guidelines
    for: all
    context: when-to-use
    items:
      - statement: Use Tooltip for labeling an icon-only button so its action is clear on hover.
        level: should
      - statement: Use Tooltip for providing supplemental context for a truncated or abbreviated label.
        level: should
      - statement: "Don't use Tooltip for showing required information such as form instructions — use visible text instead."
        level: should-not

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Never put interactive content (links, buttons) inside a Tooltip — tooltips are not focusable containers, so interactive content inside them is unreachable for keyboard and screen reader users.
        level: must-not
        tags: [accessibility]
      - statement: Use `portal` when the tooltip may be clipped by an overflow:hidden ancestor — without a portal, CSS overflow on a parent will visually clip the tooltip panel.
        level: should
        tags: [layout]
