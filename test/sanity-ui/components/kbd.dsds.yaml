id: kbd
kind: component
name: KBD
description: A keyboard key representation styled as a physical key cap.
purpose: Represent a physical keyboard key or shortcut in UI text.

metadata:
  status: {status: stable}
  tags: [typography, primitive, keyboard]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/kbd
    rel: external-link
    role: Sanity UI docs — KBD

sourceFiles:
  - platform: react
    file: ./src/primitives/kbd/kbd.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: KBD renders a <kbd> element styled as a physical keyboard key. Use it to represent keyboard shortcuts, key names, or input instructions in documentation and UI text.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: fontSize
        definition: "number | number[]. Type scale size."
      - term: padding
        definition: "number | number[]. Internal padding on the spacing scale."
      - term: radius
        definition: "number | number[]. Border radius."
