id: text
kind: component
name: Text
description: A typography primitive for body and UI text with size, weight, alignment, and tone control.
purpose: Render body and UI text with consistent typographic styling.

metadata:
  status: {status: stable}
  tags: [typography, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/text
    rel: external-link
    role: Sanity UI docs — Text

related:
  - to: heading
    rel: alternative-to
    note: Text is for body and UI copy. Heading is for page and section titles (h1–h6 semantics).
  - to: label
    rel: alternative-to
    note: Label is specifically designed for form field labels. Text is general-purpose.

sourceFiles:
  - platform: react
    file: ./src/primitives/text/text.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Text is the primary typographic primitive for body copy, labels, captions, and any UI text that is not a heading. It renders a <span> by default but can be rendered as any element via `as`. Size, weight, alignment, and muted/accent treatment are all configurable.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: size
        definition: "number | number[]. Type scale size (0–4). 0 is smallest, 4 is largest. Accepts a responsive array. Default: 2."
      - term: weight
        definition: "'regular' | 'medium' | 'semibold' | 'bold'. Font weight."
      - term: align
        definition: "'left' | 'center' | 'right' | TextAlign[]. Text alignment. Accepts a responsive array."
      - term: muted
        definition: "boolean. Renders text in a muted/secondary foreground color."
      - term: accent
        definition: "boolean. Renders text in the accent/brand foreground color."
      - term: textOverflow
        definition: "'ellipsis'. (beta) Truncates overflowing text with an ellipsis."
      - term: as
        definition: "ElementType | keyof JSX.IntrinsicElements. Render as a different HTML element (default: span)."

  - kind: guidelines
    for: all
    context: when-to-use
    items:
      - statement: Use Text for rendering body copy, captions, helper text, or UI labels.
        level: should
      - statement: "Don't use Text for page or section titles — Heading establishes document hierarchy via h1–h6 semantics, which Text does not carry."
        level: should-not
        alternatives:
          - to: heading
            rel: alternative-to

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Use `muted` for secondary or supplementary text, not for disabled states — muted text still needs sufficient contrast. Use `disabled` component states for non-interactive elements.
        level: should
        tags: [accessibility]
