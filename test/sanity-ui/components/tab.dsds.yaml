id: tab
kind: component
name: Tab / TabList / TabPanel
description: An accessible tab navigation pattern with Tab, TabList, and TabPanel components.
purpose: Implement accessible tab navigation to switch between multiple content panels.

metadata:
  status: {status: stable}
  tags: [navigation, layout, composite]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/tab
    rel: external-link
    role: Sanity UI docs — Tab

sourceFiles:
  - platform: react
    file: ./src/primitives/tab/tab.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Sanity UI provides three components for tab navigation — Tab (the individual tab trigger), TabList (the container for Tab items), and TabPanel (the content panel for each tab). They implement the ARIA tab pattern with roving tabindex keyboard navigation. State is controlled externally.

  - kind: definitions
    for: all
    title: Anatomy
    description: The tab pattern is composed of three coordinated components.
    items:
      - term: TabList
        definition: The role=tablist container that wraps all Tab triggers. Required.
      - term: Tab
        definition: An individual role=tab trigger. Associates with a TabPanel via matching `id`/`aria-controls`. Required.
      - term: TabPanel
        definition: The role=tabpanel content region shown when its associated Tab is selected. Required.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: Tab.id
        definition: "string. Unique id for the Tab, referenced by the corresponding TabPanel's `aria-labelledby`. Required."
      - term: Tab.selected
        definition: "boolean. Whether this tab is currently selected. Controlled."
      - term: Tab.onClick
        definition: "(event: React.MouseEvent) => void. Called when the tab is clicked."
      - term: Tab.label
        definition: "string. Text label for the tab."
      - term: Tab.icon
        definition: "React.ComponentType | React.ReactNode. Icon displayed alongside the tab label."
      - term: Tab.fontSize
        definition: "number | number[]. Type scale size for the tab label."
      - term: Tab.padding
        definition: "number | number[]. Internal padding."
      - term: TabList.space
        definition: "number | number[]. Gap between Tab items."
      - term: TabPanel.id
        definition: "string. Associates this panel with the Tab whose `id` matches. Required."
      - term: TabPanel.hidden
        definition: "boolean. Hides the panel when its tab is not selected."

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Use the same `id` value on Tab and the corresponding TabPanel's `aria-labelledby` and `aria-controls` — the ARIA tab pattern requires programmatic association between triggers and panels for screen reader navigation.
        level: must
        tags: [accessibility]
      - statement: Prefer hiding inactive TabPanels with the `hidden` prop rather than unmounting them — unmounting panels loses scroll position, form state, and dynamic content loaded on mount.
        level: should
        tags: [usage]
