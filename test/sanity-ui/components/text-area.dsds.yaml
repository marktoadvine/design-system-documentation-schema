id: text-area
kind: component
name: TextArea
description: A styled multi-line text input.
purpose: Capture multi-line text input from the user.

metadata:
  status: {status: stable}
  tags: [form, input, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/textarea
    rel: external-link
    role: Sanity UI docs — TextArea

related:
  - to: text-input
    rel: alternative-to
    note: TextInput is a single-line input. TextArea is for multi-line content.

sourceFiles:
  - platform: react
    file: ./src/primitives/textArea/textArea.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: TextArea renders a styled `<textarea>` element for multi-line text entry. It supports all standard textarea attributes and Sanity UI's sizing and spacing scale. It is a controlled component.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: fontSize
        definition: "number | number[]. Type scale size for input text."
      - term: padding
        definition: "number | number[]. Internal padding on the spacing scale."
      - term: radius
        definition: "number | number[]. Border radius."
      - term: rows
        definition: "number. Number of visible text rows."
      - term: resize
        definition: "'none' | 'both' | 'horizontal' | 'vertical'. CSS resize behavior for the textarea."
      - term: disabled
        definition: "boolean. Disables the textarea."
      - term: readOnly
        definition: "boolean. Renders in a non-editable state without disabling."
      - term: customValidity
        definition: "string. Custom native form validation message."

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Always associate TextArea with a visible label using `htmlFor`/`id` or aria-label — multi-line inputs need a label to communicate what content is expected.
        level: must
        tags: [accessibility]
