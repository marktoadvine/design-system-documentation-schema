id: select
kind: component
name: Select
description: A styled wrapper around the native `<select>` element.
purpose: Let the user pick one option from a list using native OS dropdown behavior.

metadata:
  status: {status: stable}
  tags: [form, input, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/select
    rel: external-link
    role: Sanity UI docs — Select

related:
  - to: autocomplete
    rel: alternative-to
    note: Autocomplete supports search/filtering within options. Select uses native OS dropdown without filtering.

sourceFiles:
  - platform: react
    file: ./src/primitives/select/select.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Select wraps a native `<select>` element with Sanity UI styling. It accepts all standard HTML select attributes as children (native `<option>` and `<optgroup>` elements). Use it when you need a dropdown list with native OS behavior.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: fontSize
        definition: "number | number[]. Type scale size for the select text."
      - term: padding
        definition: "number | number[]. Internal padding on the spacing scale."
      - term: radius
        definition: "number | number[]. Border radius."
      - term: disabled
        definition: "boolean. Disables the select."
      - term: readOnly
        definition: "boolean. Renders in a non-editable state without disabling."
      - term: customValidity
        definition: "string. Custom native validation message."

  - kind: guidelines
    for: all
    context: when-to-use
    items:
      - statement: Use Select for choosing from a list of 5 or more options where native OS dropdown behavior is acceptable.
        level: should
      - statement: "Don't use Select when you need search/filtering — use Autocomplete instead."
        level: should-not
        alternatives:
          - to: autocomplete
            rel: alternative-to
