id: avatar
kind: component
name: Avatar
description: A circular user representation with image, initials fallback, and presence status.
purpose: Represent a user or collaborator with an image, initials fallback, and optional presence indicator.

metadata:
  status: {status: stable}
  tags: [identity, presence, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/avatar
    rel: external-link
    role: Sanity UI docs — Avatar

related:
  - to: avatar-stack
    rel: pairs-with
    note: AvatarStack composes multiple Avatars with overlapping layout. Use it when showing a group of collaborators.

sourceFiles:
  - platform: react
    file: ./src/primitives/avatar/avatar.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Avatar renders a circular element representing a user or entity. It displays an image when `src` is provided, falls back to color-coded initials when the image fails to load, and supports an animated arrow for presence/cursor position indication.

  - kind: definitions
    for: all
    title: Anatomy
    description: Avatar is a circular element with an image or initials fallback, and an optional presence arrow.
    items:
      - term: Image
        definition: The user's profile photo. Shown when `src` is provided and loads successfully.
      - term: Initials
        definition: One or two-letter initials shown when no image is available. Color is determined by `color`.
      - term: Presence Arrow
        definition: An animated triangular arrow indicating the user's cursor or viewport position. Set via `arrowPosition`.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: src
        definition: "string. URL of the user's profile image."
      - term: initials
        definition: "string. Initials to display when no image is available (1–2 characters)."
      - term: color
        definition: "ThemeColorAvatarColorKey. Background color for the initials fallback. The system maps user identities to consistent colors."
      - term: size
        definition: "AvatarSize | AvatarSize[]. Avatar size (0–3). 0 is smallest."
      - term: title
        definition: "string. Tooltip text and accessible title for the avatar."
      - term: arrowPosition
        definition: "'inside' | 'outside'. Position of the presence arrow relative to the avatar circle."
      - term: animateArrowFrom
        definition: "'inside' | 'outside'. Starting position for the arrow entry animation."
      - term: onImageLoadError
        definition: "(event: Error) => void. Called when the image fails to load. Use to fall back to initials."
      - term: status
        definition: "'online' | 'offline' | 'editing' | 'away'. (alpha) Presence status indicator."

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Always set `title` to the user's name for accessibility — Avatar is an image-based element, and without a title it is not identifiable to screen reader users.
        level: must
        tags: [accessibility]
      - statement: Provide `initials` as a fallback for every Avatar that may have an image — images fail, and without initials a failed image renders an empty or placeholder circle with no identity information.
        level: must
        tags: [content]
