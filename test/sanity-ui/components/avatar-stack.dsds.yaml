id: avatar-stack
kind: component
name: AvatarStack
description: A horizontally-overlapping row of Avatar components representing a group of users.
purpose: Display a group of users as a compact, overlapping avatar row.

metadata:
  status: {status: stable}
  tags: [identity, presence, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/avatarstack
    rel: external-link
    role: Sanity UI docs — AvatarStack

related:
  - to: avatar-counter
    rel: pairs-with
    note: An AvatarCounter can be added as the last child to indicate additional users not shown.

sourceFiles:
  - platform: react
    file: ./src/primitives/avatar/avatarStack.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: AvatarStack arranges Avatar children in a horizontal overlapping layout, typically used to show a group of collaborators or participants.

  - kind: guidelines
    for: all
    context: when-to-use
    items:
      - statement: Use AvatarStack for showing a group of collaborators currently active on a document or resource.
        level: should
      - statement: Use AvatarStack for displaying a compact list of participants in a thread or project.
        level: should
