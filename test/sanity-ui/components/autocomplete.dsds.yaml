id: autocomplete
kind: component
name: Autocomplete
description: A text input with a filterable dropdown list of suggestions.
purpose: Let the user search and select from a filterable list of options.

metadata:
  status: {status: stable}
  tags: [form, input, overlay, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/autocomplete
    rel: external-link
    role: Sanity UI docs — Autocomplete

related:
  - to: select
    rel: alternative-to
    note: Select uses native OS dropdown with no filtering. Autocomplete provides typed search/filtering with a custom options list.
  - to: text-input
    rel: alternative-to
    note: TextInput is a plain text field. Autocomplete adds a filterable suggestions list.

sourceFiles:
  - platform: react
    file: ./src/primitives/autocomplete/autocomplete.tsx

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Autocomplete combines a text input with a floating list of selectable options. As the user types, options are filtered. The component is controlled — you supply the current value, the option list, and loading state, and handle changes via callbacks. It is ARIA combobox-compliant.

  - kind: definitions
    for: all
    title: Anatomy
    description: Autocomplete is a combobox combining a text input with a floating options list.
    items:
      - term: Text Input
        definition: The text field the user types into to filter options. Required.
      - term: Options List
        definition: The floating list of matching options shown while the input is focused and populated. Required.
      - term: Option Item
        definition: An individual selectable item in the list, rendered via `renderOption`. Required.
      - term: Loading Indicator
        definition: A Spinner shown inside the input when `loading` is true.
      - term: Clear Button
        definition: An icon button to clear the current value.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: value
        definition: "string. The current text value of the input. Controlled."
      - term: options
        definition: "{ value: string }[]. The list of options to display. Each item must have a `value` string."
      - term: loading
        definition: "boolean. Shows a loading spinner in the input when true."
      - term: renderOption
        definition: "(option: { value: string }) => React.ReactNode. Custom render function for each option item."
      - term: filterOption
        definition: "(query: string, option: { value: string }) => boolean. Custom filter predicate. Defaults to case-insensitive substring match."
      - term: onChange
        definition: "(value: string) => void. Called when the text input value changes."
      - term: onSelect
        definition: "(value: string) => void. Called when the user selects an option from the list."
      - term: placeholder
        definition: "string. Placeholder text shown when the input is empty."
      - term: disabled
        definition: "boolean. Disables the input."
      - term: readOnly
        definition: "boolean. Renders in a non-editable state without disabling."
      - term: radius
        definition: "number | number[]. Border radius."
      - term: fontSize
        definition: "number | number[]. Type scale size."
      - term: padding
        definition: "number | number[]. Internal padding."
      - term: customValidity
        definition: "string. Custom native form validation message."
      - term: openButton
        definition: "boolean. Show a toggle button to open the dropdown without typing."
      - term: id
        definition: "string. ID for ARIA combobox association."

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Always associate Autocomplete with a visible label via `id`/`htmlFor` — the combobox pattern requires an accessible name on the input for screen readers to announce the field purpose.
        level: must
        tags: [accessibility]
      - statement: Implement server-side filtering by updating `options` in `onChange` — do not pass the full unfiltered dataset. Large option lists degrade performance; filter on the server or in `filterOption` as the user types.
        level: should
        tags: [performance]
