id: text-input
kind: component
name: TextInput
description: A single-line text input with optional icons, prefix/suffix, and clear button.
purpose: Collect a single line of user text input with optional icons, affixes, and validation state.

metadata:
  status: {status: stable}
  tags: [form, input, interactive, primitive]

refs:
  - href: https://www.sanity.io/ui/docs/primitives/textinput
    rel: external-link
    role: Sanity UI docs — TextInput
  - href: https://github.com/sanity-io/ui/tree/main/src/primitives/textInput
    rel: source
    role: Source on GitHub

related:
  - to: text-area
    rel: alternative-to
    note: TextInput is single-line. TextArea accepts multi-line input.
  - to: autocomplete
    rel: alternative-to
    note: Autocomplete extends TextInput with a suggestion dropdown. Use Autocomplete when a predefined option list is available.

sourceFiles:
  - platform: react
    file: ./src/primitives/textInput/textInput.tsx

traits:
  - id: focus
    kind: boolean
    name: Focus
    description: Input has keyboard focus. Focus ring appears on the root container.
  - id: invalid
    kind: boolean
    name: Invalid
    description: Validation failed. Set via `customValidity`. Border and foreground shift to the critical tone.
  - id: disabled
    kind: boolean
    name: Disabled
    description: Non-interactive. Opacity reduced.
  - id: read-only
    kind: boolean
    name: Read Only
    description: Focusable but not editable. No focus ring change.

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: TextInput is the standard single-line text entry field in Sanity UI. It supports optional leading and trailing icons, a prefix and suffix for units or labels, a built-in clear button, and custom validation states. All sizing props accept responsive arrays.

  - kind: definitions
    for: all
    title: Anatomy
    description: TextInput wraps a native <input> with layout slots for prefix, icons, suffix, and a clear button.
    items:
      - term: Root
        definition: The outer container. Provides border, radius, background, and focus ring. Required.
      - term: Prefix
        definition: "Optional slot for a text label or unit rendered before the input (e.g. 'https://', '$')."
      - term: Leading Icon
        definition: Optional icon rendered before the input text area.
      - term: Input
        definition: The native <input> element. Required.
      - term: Clear Button
        definition: Optional button that clears the input value. Appears when the field has content and `clearButton` is enabled.
      - term: Trailing Icon
        definition: Optional icon rendered after the input text area.
      - term: Suffix
        definition: "Optional slot for a text label or unit rendered after the input (e.g. 'px', 'kg')."

  - kind: definitions
    for: all
    title: Props
    items:
      - term: value
        definition: "string. The controlled input value."
      - term: onChange
        definition: "(event: React.ChangeEvent<HTMLInputElement>) => void. Handler for value changes."
      - term: type
        definition: "TextInputType. HTML input type. Accepts all standard text-like types: 'text', 'email', 'url', 'search', 'password', 'tel', 'number'. Default: 'text'."
      - term: icon
        definition: "ElementType | ReactNode. Leading icon rendered before the input area."
      - term: iconRight
        definition: "ElementType | ReactNode. Trailing icon rendered after the input area."
      - term: prefix
        definition: "ReactNode. Content rendered in the prefix slot (e.g. 'https://')."
      - term: suffix
        definition: "ReactNode. Content rendered in the suffix slot (e.g. 'px')."
      - term: clearButton
        definition: "boolean | TextInputClearButtonProps. (beta) When true, shows a clear button when the field has content."
      - term: onClear
        definition: "() => void. (beta) Called when the clear button is activated."
      - term: border
        definition: "boolean. When false, removes the input border. Default: true."
      - term: fontSize
        definition: "number | number[]. Type scale size for input text."
      - term: padding
        definition: "number | number[]. Internal padding on the spacing scale."
      - term: radius
        definition: "number | number[]. Border radius on the radius scale."
      - term: weight
        definition: "'regular' | 'medium' | 'semibold' | 'bold'. Font weight of the input text."
      - term: customValidity
        definition: "string. Sets a custom validation message. When non-empty, the field renders in an error/invalid state."
      - term: disabled
        definition: "boolean. Makes the field non-interactive."
      - term: readOnly
        definition: "boolean. Makes the field read-only — focusable but not editable."
      - term: placeholder
        definition: "string. Placeholder text shown when the field is empty."

  - kind: definitions
    for: all
    title: Events
    items:
      - term: onChange
        definition: "(event: React.ChangeEvent<HTMLInputElement>) => void. Fires when the input value changes."
      - term: onFocus
        definition: "(event: React.FocusEvent<HTMLInputElement>) => void. Fires when the input receives focus."
      - term: onBlur
        definition: "(event: React.FocusEvent<HTMLInputElement>) => void. Fires when the input loses focus."
      - term: onClear
        definition: "() => void. (beta) Fires when the clear button is activated."

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Always associate a TextInput with a visible label using htmlFor and a <label> element — inputs without associated labels fail WCAG 1.3.1 and are not operable by screen reader users.
        level: must
        tags: [accessibility]
        evidence:
          - href: https://www.w3.org/TR/WCAG22/#info-and-relationships
            rel: external-link
      - statement: Use `customValidity` to communicate validation state rather than toggling a separate error component — customValidity integrates with the browser's constraint validation API and applies the critical visual state consistently.
        level: should
        tags: [development]
      - statement: Do not use `placeholder` as a substitute for a label — placeholder text disappears on input, is not reliably announced by all screen readers, and has low color contrast by default.
        level: must-not
        tags: [accessibility]
      - statement: "aria-label should be used when a visible label cannot be provided."
        level: should
        tags: [accessibility]
      - statement: "aria-describedby should associate the input with a helper text or error message element."
        level: should
        tags: [accessibility]
      - statement: "aria-invalid should be set to true when customValidity is non-empty."
        level: should
        tags: [accessibility]

  - kind: definitions
    for: all
    title: Keyboard interactions
    items:
      - term: Tab
        definition: Moves focus to the input.
      - term: Shift+Tab
        definition: Moves focus away from the input.

  - kind: guidelines
    for: agent
    context: how-to-use
    items:
      - statement: Always pair TextInput with a visible <label> element.
        level: must
      - statement: Do not use placeholder as a label replacement.
        level: must-not
