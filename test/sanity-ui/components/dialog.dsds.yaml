id: dialog
kind: component
name: Dialog
description: A modal overlay that interrupts the current view and traps focus until dismissed.
purpose: Present a focused modal interaction that interrupts the page until the user completes or dismisses it.

metadata:
  status: {status: stable}
  tags: [overlay, modal, interactive, component]

refs:
  - href: https://www.sanity.io/ui/docs/components/dialog
    rel: external-link
    role: Sanity UI docs — Dialog
  - href: https://github.com/sanity-io/ui/tree/main/src/components/dialog
    rel: source
    role: Source on GitHub

related:
  - to: popover
    rel: alternative-to
    note: Dialog traps focus and blocks the page (modal). Popover is non-blocking and lighter-weight.
  - to: toast
    rel: alternative-to
    note: Toast is a non-blocking notification. Dialog is a blocking modal interaction.
  - to: menu-button
    rel: alternative-to
    note: MenuButton + Menu is the correct pattern for dropdown action menus. Dialog is too heavy for this use case.

sourceFiles:
  - platform: react
    file: ./src/components/dialog/dialog.tsx

traits:
  - id: position
    kind: enum
    name: Position
    description: Controls where the dialog panel is positioned on the screen.
    values:
      - id: fixed
        description: Centered in the viewport. The default and most common position.
      - id: absolute
        description: Positioned relative to the nearest positioned ancestor.

sections:
  - kind: section
    for: all
    title: Overview
    freeform:
      - title: About
        body: Dialog renders a floating panel over the current view. It traps focus within its content, disables interaction with the underlying page, and supports a configurable header, scrollable body, and optional footer. Dialogs are controlled — the parent is responsible for mounting/unmounting the Dialog based on open state. They render into a Portal by default.

  - kind: definitions
    for: all
    title: Anatomy
    description: Dialog renders a backdrop overlay and a floating card panel. The panel contains a header, scrollable body, and optional footer.
    items:
      - term: Backdrop
        definition: A full-screen overlay behind the dialog panel that dims the page. Clicking it calls `onClickOutside`. Required.
      - term: Panel
        definition: The floating card surface that contains all dialog content. Required.
      - term: Header
        definition: The top section. Renders `header` prop content. Contains the close button by default.
      - term: Close Button
        definition: A button in the header that calls `onClose`. Hidden with `__unstable_hideCloseButton`. Required.
      - term: Body
        definition: The scrollable content area. Receives `children`. Required.
      - term: Footer
        definition: The bottom section. Renders `footer` prop content. Typically used for action buttons.

  - kind: definitions
    for: all
    title: Props
    items:
      - term: id
        definition: "string. Unique identifier. Used to associate the dialog with its trigger via aria-controls and aria-labelledby. Required."
      - term: header
        definition: "ReactNode. Content rendered in the header section. Typically a title string."
      - term: footer
        definition: "ReactNode. Content rendered in the footer section. Typically action buttons."
      - term: onClose
        definition: "() => void. Called when the close button is activated. The parent is responsible for unmounting the Dialog."
      - term: onClickOutside
        definition: "() => void. Called when the user clicks the backdrop. Usually calls the same handler as onClose."
      - term: width
        definition: "number | 'auto' | (number | 'auto')[]. Controls the maximum width of the dialog panel using the container width scale."
      - term: padding
        definition: "number | number[]. Internal padding for the dialog body."
      - term: position
        definition: "DialogPosition | DialogPosition[]. Positioning strategy for the panel."
      - term: scheme
        definition: "'light' | 'dark'. Override the color scheme for the dialog panel and all descendants."
      - term: portal
        definition: "string. Target portal ID. Defaults to the root portal."
      - term: cardRadius
        definition: "number | number[]. Border radius of the dialog panel card."
      - term: cardShadow
        definition: "number | number[]. Shadow depth of the dialog panel card."
      - term: zOffset
        definition: "number | number[]. Additional z-index offset for stacking."
      - term: animate
        definition: "boolean. (beta) Enable entry/exit animation. Default: false."

  - kind: definitions
    for: all
    title: Events
    items:
      - term: onClose
        definition: "() => void. Called when the close button is activated."
      - term: onClickOutside
        definition: "() => void. Called when the backdrop receives a click."

  - kind: guidelines
    for: all
    context: when-to-use
    items:
      - statement: Use Dialog for requesting confirmation for a destructive or irreversible action (delete, publish, revoke).
        level: should
      - statement: Use Dialog for presenting a focused editing form that should not compete with the underlying page.
        level: should
      - statement: Use Dialog for showing detailed content that the user intentionally opened.
        level: should
      - statement: "Don't use Dialog for displaying persistent secondary content or navigation — popovers are lighter-weight and do not trap focus or block page interaction. Use them for contextual menus and non-critical overlays."
        level: should-not
        alternatives:
          - to: popover
            rel: alternative-to
      - statement: "Don't use Dialog for showing a small contextual action menu — MenuButton + Menu is the correct pattern for dropdown action menus. Dialog is too heavy for this use case."
        level: should-not
        alternatives:
          - to: menu-button
            rel: alternative-to

  - kind: guidelines
    for: human
    context: how-to-use
    items:
      - statement: Always provide an `onClose` and `onClickOutside` handler so the user can dismiss the dialog — a dialog with no dismiss path traps the user. Both the close button and backdrop click should call the same dismiss handler.
        level: must
        tags: [interaction]
      - statement: Keep dialog content focused on a single task or decision — dialogs interrupt the user's primary flow. Multi-step wizards or complex workflows should be handled in a dedicated page or panel.
        level: should
        tags: [ux]
      - statement: Place destructive confirmation actions in the footer, not the header — the footer is the natural completion zone since users scan top-to-bottom. Placing critical actions in the header violates this mental model.
        level: must
        tags: [visual-design]
      - statement: "role=\"dialog\" is applied automatically to the panel element."
        level: must
        tags: [accessibility]
      - statement: "aria-modal=\"true\" is applied automatically to indicate the dialog is modal."
        level: must
        tags: [accessibility]
      - statement: "aria-labelledby should reference the dialog header element ID. Set this when providing a `header` prop."
        level: should
        tags: [accessibility]

  - kind: definitions
    for: all
    title: Keyboard interactions
    items:
      - term: Escape
        definition: Closes the dialog (calls onClose).
      - term: Tab
        definition: Moves focus forward within the dialog. Focus is trapped inside.
      - term: Shift+Tab
        definition: Moves focus backward within the dialog. Focus is trapped inside.

  - kind: guidelines
    for: agent
    context: how-to-use
    items:
      - statement: Always provide an onClose handler.
        level: must
      - statement: Always provide a way to dismiss via keyboard (Escape is handled automatically).
        level: must
      - statement: Keep dialog content scoped to a single task.
        level: should
