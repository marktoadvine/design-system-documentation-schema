schemaVersion: "0.20.0"

name: Sanity UI

entries:
  - id: sanity-ui
    kind: system
    name: Sanity UI
    description: A comprehensive DSDS documentation corpus for Sanity UI, a React component library for Sanity products.
    metadata:
      version: 2.x
      url: https://www.sanity.io/ui
      status: {status: stable}
    refs:
      - href: https://www.sanity.io/ui
        rel: external-link
        role: Sanity UI homepage

# Each component below is its own standalone entry, in its own sibling
# file — not inlined here — so the corpus stays one file per component
# (git history, per-component review) the way it always has. `rel: file`
# is the sanctioned way to point at a sibling document that owns another
# entry in this same system (see base.schema.yaml's own $comment).
refs:
  - href: ./components/autocomplete.dsds.yaml
    rel: file
    role: Autocomplete component
